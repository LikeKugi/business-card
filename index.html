<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="A close-up photo of a blooming pink flower">
        <p class="full-name">Like Kugi</p>
        <p class="designation">Full Stack Developer</p>
        <p class="company">Kugi Web Labs</p>
        <hr>
        <p>like@kugiweblabs.com</p>
        <p>+1 (555) 123-4567</p>
        <a class="portfolio-link" href="https://www.freecodecamp.org/">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://twitter.com/">Twitter</a>
            <a href="https://www.linkedin.com/">LinkedIn</a>
            <a href="https://github.com/">GitHub</a>
        </div>
    </div>
</body>

</html>
